<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Состояние смены</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css?v=49" />
  <script>window.MINIAPP_API_BASE = window.MINIAPP_API_BASE || "";</script>
</head>
<body>
  <div id="app" class="shell">
    <header class="top">
      <div class="top-text">
        <p class="brand">Состояние <span>смены</span></p>
        <p class="sub" id="roleLine">Загрузка…</p>
      </div>
      <button type="button" class="period" id="btnPeriod" hidden>Неделя</button>
    </header>

    <div class="loc-bar" id="locBar" hidden>
      <label for="locSelect">Точка</label>
      <select id="locSelect"></select>
    </div>

    <main id="view" class="view" aria-live="polite">
      <p class="muted center">Открываем…</p>
    </main>

    <nav class="tabbar" id="tabbar" hidden>
      <button type="button" data-tab="home" class="on"><span class="ico">⌂</span><span>Обзор</span></button>
      <button type="button" data-tab="signals"><span class="ico">●</span><span>Горящие</span></button>
      <button type="button" data-tab="mentor"><span class="ico">✦</span><span>Наставник</span></button>
      <button type="button" data-tab="report"><span class="ico">☰</span><span>Отчёт</span></button>
      <button type="button" data-tab="more"><span class="ico">⋯</span><span>Ещё</span></button>
    </nav>
  </div>
  <script src="app.js?v=49"></script>
</body>
</html>
