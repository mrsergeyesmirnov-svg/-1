<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Казна · вход</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="brand">Казна<span>.</span></div>
      <p class="lead">Счета, кассы, заявки и календарь оплат — с разными входами для финдира и управляющих.</p>

      <div id="error" class="error" role="alert"></div>

      <form id="loginForm" autocomplete="on">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required placeholder="fin@kazna.local" value="fin@kazna.local" />
        </div>
        <div class="field">
          <label for="password">Пароль</label>
          <input id="password" name="password" type="password" required placeholder="••••••••" value="kazna2026" />
        </div>
        <button class="btn block" type="submit">Войти</button>
      </form>

      <div class="demo">
        Демо-аккаунты:<br />
        Финдир — <code>fin@kazna.local</code> / <code>kazna2026</code><br />
        Управляющий — <code>manager@kazna.local</code> / <code>kazna2026</code>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    (function () {
      var s = KaznaAuth.current();
      if (s) location.replace(KaznaAuth.homeFor(s.role));

      document.getElementById("loginForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var email = document.getElementById("email").value;
        var password = document.getElementById("password").value;
        var res = KaznaAuth.login(email, password);
        var err = document.getElementById("error");
        if (!res.ok) {
          err.textContent = res.error;
          err.classList.add("on");
          return;
        }
        location.href = KaznaAuth.homeFor(res.session.role);
      });
    })();
  </script>
</body>
</html>
