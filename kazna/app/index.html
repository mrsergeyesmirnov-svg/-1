<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Казна · вход</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="brand">Казна<span>.</span></div>
      <p class="lead">Счета, кассы, заявки и календарь оплат — с разными входами для финдира и управляющих.</p>
      <div id="error" class="error" role="alert"></div>
      <form id="loginForm" autocomplete="on">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required placeholder="you@company.ru" autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Пароль</label>
          <input id="password" name="password" type="password" required placeholder="••••••••" autocomplete="current-password" />
        </div>
        <button class="btn block" type="submit">Войти</button>
      </form>
      <div class="demo" id="demoBox" hidden></div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script>
    (function () {
      function homeFor(role) {
        return role === "manager" ? "/manager.html" : "/home.html";
      }
      KaznaAPI.me().then(function (u) {
        location.replace(homeFor(u.role));
      }).catch(function () {});

      fetch("/api/public/bootstrap", { credentials: "same-origin" })
        .then(function (r) { return r.json(); })
        .then(function (b) {
          if (!b.demoMode) return;
          var box = document.getElementById("demoBox");
          box.hidden = false;
          box.innerHTML =
            "Демо-режим:<br />" +
            "Финдир — <code>fin@kazna.local</code> / <code>kazna2026</code><br />" +
            "Управляющий — <code>manager@kazna.local</code> / <code>kazna2026</code>";
          document.getElementById("email").value = "fin@kazna.local";
          document.getElementById("password").value = "kazna2026";
        })
        .catch(function () {});

      document.getElementById("loginForm").addEventListener("submit", async function (e) {
        e.preventDefault();
        var err = document.getElementById("error");
        err.classList.remove("on");
        try {
          var res = await KaznaAPI.login(
            document.getElementById("email").value,
            document.getElementById("password").value
          );
          location.href = homeFor(res.user.role);
        } catch (ex) {
          err.textContent = ex.message || "Ошибка входа";
          err.classList.add("on");
        }
      });
    })();
  </script>
</body>
</html>
