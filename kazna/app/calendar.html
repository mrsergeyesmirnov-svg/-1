<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Казна · Календарь</title>
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="app" id="app" hidden>
    <div class="topbar">
      <div class="logo">Казна<span>.</span></div>
      <button class="btn ghost sm" type="button" id="logoutBtn">Выйти</button>
    </div>
    <nav class="nav">
      <a href="/home.html">Обзор</a>
      <a href="/money.html">Деньги</a>
      <a class="on" href="/calendar.html">Календарь</a>
      <a href="/requests.html">Заявки</a>
      <a href="/import.html">Импорт</a>
      <a href="/people.html">Люди</a>
    </nav>
    <div class="badge">Платежи по датам</div>
    <h1>Календарь</h1>
    <p class="sub">Пока список из Excel. Drag&drop и iiko — дальше.</p>
    <div class="panel" id="list"></div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/pay-row.js"></script>
  <script>
    KaznaAPI.me().then(async function (user) {
      if (user.role === "manager") { location.href = "/manager.html"; return; }
      document.getElementById("app").hidden = false;
      document.getElementById("logoutBtn").onclick = async function () {
        await KaznaAPI.logout(); location.href = "/";
      };
      var rows = await KaznaAPI.payments();
      document.getElementById("list").innerHTML = rows.length
        ? rows.map(KaznaPayRow.render).join("")
        : '<p class="muted">Пусто. Загрузите Excel.</p>';
    }).catch(function () { location.href = "/"; });
  </script>
</body>
</html>
