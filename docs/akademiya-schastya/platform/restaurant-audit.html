<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Master Audit · Академия счастья</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="site.css" />
  <link rel="stylesheet" href="crm.css" />
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root{--ink:#1c1917;--muted:#78716c;--line:#e7e5e4;--bg:#f5f5f4;--good:#15803d;--mid:#b45309;--bad:#be123c;--blue:#1d4ed8}
    *{box-sizing:border-box} body.audit-page{background:var(--bg);color:var(--ink);min-height:100vh;font-family:Mulish,system-ui,sans-serif}
    .shell{max-width:920px;margin:0 auto;padding:18px 14px calc(100px + env(safe-area-inset-bottom))}.top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:14px}.top h1{font-size:clamp(1.45rem,7vw,2.15rem);letter-spacing:-.045em;margin:0}.top p{margin:5px 0 0;color:var(--muted);font-size:.88rem}
    .card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 10px 28px rgba(28,25,23,.05);margin-bottom:12px}.card h2,.card h3{margin:0 0 8px;letter-spacing:-.025em}.muted{color:var(--muted);font-size:.84rem}.hidden{display:none!important}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:.72rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0 0 5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;background:#fff;color:var(--ink)}.field textarea{min-height:80px;resize:vertical}
    .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:11px 14px;font:inherit;font-weight:800;cursor:pointer;text-decoration:none}.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.good{background:#ecfdf5;color:#166534;border-color:#bbf7d0}.btn.danger{color:var(--bad)}.btn:disabled{opacity:.45;cursor:not-allowed}
    .login{max-width:430px;margin:10vh auto 0}.login h1{margin:0 0 6px;font-size:1.8rem}.error{background:#fff1f2;border:1px solid #fecdd3;color:#9f1239;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:.86rem}.okline{font-size:.78rem;color:var(--good);min-height:1.2em}.offline{color:var(--mid)}
    .progress-wrap{position:sticky;top:0;z-index:8;background:rgba(245,245,244,.96);backdrop-filter:blur(14px);margin:0 -14px 10px;padding:10px 14px 9px;border-bottom:1px solid rgba(231,229,228,.8)}.progress-meta{display:flex;justify-content:space-between;gap:12px;font-size:.78rem;font-weight:700;margin-bottom:7px}.progress{height:7px;background:#e7e5e4;border-radius:999px;overflow:hidden}.progress>div{height:100%;background:var(--ink);transition:width .2s ease}
    .question-head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}.code{font-size:.75rem;color:var(--muted);font-weight:800}.critical{font-size:.7rem;font-weight:800;color:#9f1239;background:#fff1f2;border-radius:999px;padding:5px 8px;white-space:nowrap}.question{font-size:clamp(1.15rem,5vw,1.55rem);line-height:1.25;font-weight:800;letter-spacing:-.025em;margin:12px 0 9px}.evidence{background:#fafaf9;border-radius:12px;padding:10px 12px;color:#57534e;font-size:.84rem;line-height:1.4}.scores{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.score{border:1px solid var(--line);border-radius:14px;padding:12px 6px;background:#fff;font:inherit;font-weight:800;cursor:pointer}.score small{display:block;font-size:.62rem;font-weight:700;color:var(--muted);margin-top:3px}.score.on[data-score="0"]{background:#fff1f2;border-color:#fda4af;color:#9f1239}.score.on[data-score="1"]{background:#fffbeb;border-color:#fcd34d;color:#92400e}.score.on[data-score="2"]{background:#ecfdf5;border-color:#86efac;color:#166534}.score.on[data-na="1"]{background:#f5f5f4;border-color:#a8a29e}
    .nav{display:flex;justify-content:space-between;gap:8px}.nav .btn{flex:1}.session{display:flex;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:11px 0}.session:first-child{border-top:0}.scorebig{font-size:1.3rem;font-weight:800;white-space:nowrap}.pill{display:inline-block;border-radius:999px;background:#f5f5f4;padding:5px 8px;font-size:.72rem;font-weight:800}.pill.red{background:#fff1f2;color:#9f1239}.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{border:1px solid var(--line);border-radius:14px;padding:12px}.metric .k{font-size:.72rem;color:var(--muted);font-weight:800}.metric .v{font-size:1.55rem;font-weight:800;margin-top:3px}.blockrow{display:grid;grid-template-columns:1fr auto;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:.86rem}.blockrow:first-child{border-top:0}
    @media(max-width:650px){.grid{grid-template-columns:1fr}.scores{grid-template-columns:1fr 1fr}.summary-grid{grid-template-columns:1fr}.top{align-items:center}.hide-mobile{display:none!important}}
  </style>
</head>
<body class="audit-page">
  <div class="shell">
    <div id="loginView" class="login hidden">
      <div class="card">
        <p class="muted" style="margin-top:0">Академия счастья · внутренний контур</p>
        <h1>Вход консультанта</h1>
        <p class="muted">Только логин и пароль. Без Google Authenticator.</p>
        <div id="loginErr" class="error hidden"></div>
        <form id="loginForm">
          <div class="field"><label>Логин</label><input id="loginUser" autocomplete="username" required /></div>
          <div class="field" style="margin-top:10px"><label>Пароль</label><input id="loginPass" type="password" autocomplete="current-password" required /></div>
          <button class="btn primary" style="width:100%;margin-top:14px" type="submit">Войти</button>
        </form>
      </div>
    </div>

    <div id="appView" class="hidden">
      <div class="top">
        <div><h1>Master Audit</h1><p id="whoLine">AH Restaurant Operating System · 150 стандартов</p></div>
        <button id="logoutBtn" class="btn hide-mobile" type="button">Выйти</button>
      </div>
      <div id="homeView"></div>
      <div id="auditView" class="hidden"></div>
      <div id="summaryView" class="hidden"></div>
    </div>
  </div>
  <script src="crm-store.js"></script>
  <script>
  (() => {
    const API = window.AH_API_BASE || (location.hostname === 'api.pulseteam.online' ? location.origin : 'https://api.pulseteam.online');
    const TOKEN_KEY='ah_platform_token_v1', PENDING_KEY='ah_audit_pending_v1';
    const CSV=['data/master-audit-01.csv','data/master-audit-02.csv','data/master-audit-03.csv'];
    let token=localStorage.getItem(TOKEN_KEY)||'', me=null, template=[], session=null, answers={}, idx=0, history=[];
    const $=id=>document.getElementById(id);
    const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    function api(path, opts={}){ const h=Object.assign({'Content-Type':'application/json'},opts.headers||{}); if(token)h.Authorization='Bearer '+token; return fetch(API+path,Object.assign({},opts,{headers:h})).then(async r=>{let d={};try{d=await r.json()}catch(_){d={}} if(r.status===401){logout(false);throw new Error('Нужно войти заново')} if(!r.ok||d.ok===false)throw new Error(d.error||('HTTP '+r.status));return d;}); }
    function parseCSV(text){let rows=[],row=[],cell='',q=false;for(let i=0;i<text.length;i++){let c=text[i];if(q){if(c==='"'&&text[i+1]==='"'){cell+='"';i++;}else if(c==='"')q=false;else cell+=c;}else if(c==='"')q=true;else if(c===','){row.push(cell);cell='';}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell='';}else cell+=c;}if(cell||row.length){row.push(cell);rows.push(row)}let head=rows.shift()||[];return rows.filter(r=>r.length&&r[0]).map(r=>Object.fromEntries(head.map((h,i)=>[h,r[i]??''])))}
    async function loadTemplate(){if(template.length)return;let chunks=await Promise.all(CSV.map(u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Не загрузился шаблон '+u);return r.text()})));template=chunks.flatMap(parseCSV).map(x=>({id:+x.id,code:x.code,section:x.section,weight:+x.weight,critical:x.critical==='ДА',standard:x.standard,evidence:x.evidence})).sort((a,b)=>a.id-b.id);if(template.length!==150)throw new Error('В шаблоне '+template.length+' пунктов вместо 150');}
    function showLogin(err=''){ $('loginView').classList.remove('hidden');$('appView').classList.add('hidden');$('loginErr').classList.toggle('hidden',!err);$('loginErr').textContent=err; }
    function showApp(){ $('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('whoLine').textContent=(me.display_name||me.username)+' · '+me.role; renderHome(); }
    async function boot(){try{await loadTemplate();if(!token)return showLogin();let d=await api('/api/platform/me');me=d.user;await flushPending();showApp();}catch(e){showLogin(e.message)}}
    $('loginForm').onsubmit=async e=>{e.preventDefault();$('loginErr').classList.add('hidden');try{let d=await fetch(API+'/api/platform/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('loginUser').value.trim(),password:$('loginPass').value})}).then(async r=>{let x=await r.json();if(!r.ok)throw new Error(x.error||'Не удалось войти');return x});token=d.token;me=d.user;localStorage.setItem(TOKEN_KEY,token);sessionStorage.setItem('ss_audit_ok','1');await flushPending();showApp();}catch(err){showLogin(err.message)}};
    async function logout(call=true){if(call&&token){try{await api('/api/platform/logout',{method:'POST',body:'{}'})}catch(_){}}token='';me=null;localStorage.removeItem(TOKEN_KEY);sessionStorage.removeItem('ss_audit_ok');showLogin();}
    $('logoutBtn').onclick=()=>logout(true);
    function crmClients(){try{return window.SSCrm?SSCrm.listClients():[]}catch(_){return[]}}
    async function renderHome(){ $('auditView').classList.add('hidden');$('summaryView').classList.add('hidden');$('homeView').classList.remove('hidden'); let clients=crmClients();let opts=clients.map(c=>`<option value="${esc(c.id)}">${esc(c.name||'Без названия')}</option>`).join('');$('homeView').innerHTML=`
      <div class="card"><h2>Новый аудит</h2><p class="muted">Ответы сохраняются сразу в Railway Postgres. Можно начать на телефоне и продолжить с другого устройства.</p>
        <div class="grid"><div class="field"><label>Ресторан из CRM</label><select id="clientSel"><option value="">— выбрать / ввести вручную —</option>${opts}</select></div><div class="field"><label>Контрольная точка</label><select id="auditType"><option value="day0">Day 0 · точка отсчёта</option><option value="day30">Day 30 · контроль</option><option value="day60">Day 60 · итог</option><option value="extra">Внеплановый</option></select></div></div>
        <div class="field" style="margin-top:10px"><label>Название вручную</label><input id="manualRestaurant" placeholder="Например, MOJO · Невский" /></div>
        <div class="actions"><button id="startBtn" class="btn primary">Начать аудит</button><a class="btn" href="crm.html">CRM</a><button id="refreshBtn" class="btn">Обновить историю</button></div>
      </div><div class="card"><h2>История</h2><div id="historyBox" class="muted">Загрузка…</div></div>`;
      $('startBtn').onclick=startAudit;$('refreshBtn').onclick=loadHistory;await loadHistory(); }
    async function loadHistory(){let box=$('historyBox');if(!box)return;try{let d=await api('/api/platform/audits?limit=50');history=d.audits||[];if(!history.length){box.innerHTML='Аудитов пока нет.';return}box.innerHTML=history.map(a=>`<div class="session"><div><b>${esc(a.restaurant_title)}</b><div class="muted">${labelType(a.audit_type)} · ${fmt(a.started_at)} · ${a.status==='completed'?'завершён':'черновик'}</div></div><div style="display:flex;gap:8px;align-items:center"><div class="scorebig">${a.overall_score==null?'—':a.overall_score}</div><button class="btn" data-open="${esc(a.id)}">${a.status==='completed'?'Отчёт':'Продолжить'}</button></div></div>`).join('');box.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openAudit(b.dataset.open));}catch(e){box.innerHTML='<span style="color:#9f1239">'+esc(e.message)+'</span>'}}
    function labelType(t){return ({day0:'Day 0',day30:'Day 30',day60:'Day 60',extra:'Внеплановый'})[t]||t}
    function fmt(s){if(!s)return'';try{return new Date(s).toLocaleString('ru-RU',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}catch(_){return s}}
    async function startAudit(){let clients=crmClients(),cid=$('clientSel').value,c=clients.find(x=>x.id===cid),manual=$('manualRestaurant').value.trim();let title=c?(c.name||'Без названия'):manual;if(!title)return alert('Выберите ресторан или введите название');let key=c?('crm:'+c.id):('manual:'+title.toLowerCase().replace(/\s+/g,'-').slice(0,100));try{let d=await api('/api/platform/audits/start',{method:'POST',body:JSON.stringify({restaurant_key:key,restaurant_title:title,audit_type:$('auditType').value,template_version:'AH-AUDIT-1.0'})});await openAudit(d.audit.id);}catch(e){alert(e.message)}}
    async function openAudit(id){try{let d=await api('/api/platform/audits/'+encodeURIComponent(id));session=d.audit;answers={};(d.answers||[]).forEach(a=>answers[a.item_id]=a);idx=0;let first=template.findIndex(it=>!answers[it.id]||(!(answers[it.id].is_na)&&answers[it.id].score==null));if(first>=0)idx=first;if(session.status==='completed')return renderSummary(d);$('homeView').classList.add('hidden');$('summaryView').classList.add('hidden');$('auditView').classList.remove('hidden');renderQuestion();}catch(e){alert(e.message)}}
    function answeredCount(){return template.filter(it=>{let a=answers[it.id];return a&&(a.is_na||a.score===0||a.score===1||a.score===2)}).length}
    function renderQuestion(){let it=template[idx],a=answers[it.id]||{};let done=answeredCount(),pct=Math.round(done/150*100);$('auditView').innerHTML=`<div class="progress-wrap"><div class="progress-meta"><span>${esc(session.restaurant_title)} · ${labelType(session.audit_type)}</span><span>${done}/150</span></div><div class="progress"><div style="width:${pct}%"></div></div></div>
      <div class="card"><div class="question-head"><div><div class="code">${esc(it.code)} · ${esc(it.section)}</div></div>${it.critical?'<span class="critical">КРИТИЧНЫЙ</span>':''}</div><div class="question">${esc(it.standard)}</div><div class="evidence"><b>Как проверить:</b> ${esc(it.evidence)}</div>
      <div class="scores"><button class="score ${a.score===0&&!a.is_na?'on':''}" data-score="0">0<small>нет системы</small></button><button class="score ${a.score===1&&!a.is_na?'on':''}" data-score="1">1<small>частично</small></button><button class="score ${a.score===2&&!a.is_na?'on':''}" data-score="2">2<small>работает</small></button><button class="score ${a.is_na?'on':''}" data-na="1">N/A<small>не применимо</small></button></div>
      <div class="field"><label>Комментарий / evidence</label><textarea id="comment" placeholder="Можно надиктовать голосовой клавиатурой iPhone…">${esc(a.comment||'')}</textarea></div><div id="saveState" class="okline"></div>
      <div class="nav"><button class="btn" id="prevBtn" ${idx===0?'disabled':''}>← Назад</button><button class="btn" id="nextBtn">${idx===149?'К итогу':'Дальше →'}</button></div></div>
      <div class="actions"><button class="btn" id="homeBtn">← Список аудитов</button><button class="btn primary" id="finishBtn" ${done<150?'disabled':''}>Завершить аудит</button></div>`;
      document.querySelectorAll('.score').forEach(b=>b.onclick=async()=>{let na=b.dataset.na==='1',score=na?null:+b.dataset.score;await saveAnswer(it,score,na,$('comment').value);if(idx<149){idx++;renderQuestion()}else renderQuestion()});$('comment').onblur=()=>{let cur=answers[it.id];if(cur&&(cur.is_na||cur.score!=null))saveAnswer(it,cur.score,cur.is_na,$('comment').value)};$('prevBtn').onclick=()=>{if(idx>0){idx--;renderQuestion()}};$('nextBtn').onclick=()=>{if(idx<149){idx++;renderQuestion()}else if(answeredCount()===150)finishAudit();else alert('Заполните все 150 пунктов или отметьте N/A')};$('homeBtn').onclick=renderHome;$('finishBtn').onclick=finishAudit; }
    function pending(){try{return JSON.parse(localStorage.getItem(PENDING_KEY)||'[]')}catch(_){return[]}} function setPending(x){localStorage.setItem(PENDING_KEY,JSON.stringify(x))}
    async function saveAnswer(it,score,isNa,comment){let payload={item_id:it.id,item_code:it.code,section:it.section,weight:it.weight,critical:it.critical,standard:it.standard,evidence_hint:it.evidence,score:score,is_na:isNa,comment:comment||''};answers[it.id]=Object.assign({},payload);let st=$('saveState');if(st)st.textContent='сохраняем…';try{await api('/api/platform/audits/'+session.id+'/answer',{method:'POST',body:JSON.stringify(payload)});if(st){st.className='okline';st.textContent='✓ сохранено в Postgres'}}catch(e){let q=pending().filter(x=>!(x.audit_id===session.id&&x.payload.item_id===it.id));q.push({audit_id:session.id,payload});setPending(q);if(st){st.className='okline offline';st.textContent='офлайн: сохраню при восстановлении связи'}}}
    async function flushPending(){let q=pending();if(!q.length)return;let left=[];for(let x of q){try{await api('/api/platform/audits/'+x.audit_id+'/answer',{method:'POST',body:JSON.stringify(x.payload)})}catch(_){left.push(x)}}setPending(left)}
    async function finishAudit(){if(answeredCount()<150)return alert('Заполните все 150 пунктов');try{await flushPending();let d=await api('/api/platform/audits/'+session.id+'/complete',{method:'POST',body:'{}'});let full=await api('/api/platform/audits/'+session.id);renderSummary(full);}catch(e){alert(e.message)}}
    function renderSummary(full){session=full.audit;answers={};(full.answers||[]).forEach(a=>answers[a.item_id]=a);$('homeView').classList.add('hidden');$('auditView').classList.add('hidden');$('summaryView').classList.remove('hidden');let blocks=session.block_scores||{},blockHtml=Object.entries(blocks).map(([k,v])=>`<div class="blockrow"><span>${esc(k)}</span><b>${v==null?'—':v}</b></div>`).join('');let prev=history.filter(a=>a.restaurant_key===session.restaurant_key&&a.status==='completed'&&a.id!==session.id&&a.overall_score!=null&&new Date(a.started_at)<new Date(session.started_at)).sort((a,b)=>new Date(b.started_at)-new Date(a.started_at))[0];let delta=prev?Math.round((session.overall_score-prev.overall_score)*10)/10:null;$('summaryView').innerHTML=`<div class="card"><p class="muted" style="margin-top:0">${esc(session.restaurant_title)} · ${labelType(session.audit_type)}</p><h2>Результат аудита</h2><div class="summary-grid"><div class="metric"><div class="k">Общий индекс</div><div class="v">${session.overall_score??'—'}</div></div><div class="metric"><div class="k">Red Flags</div><div class="v">${session.red_flags_count}</div></div><div class="metric"><div class="k">Изменение</div><div class="v">${delta==null?'—':(delta>0?'+':'')+delta}</div></div></div>${prev?`<p class="muted">Предыдущий завершённый аудит: ${prev.overall_score} · ${labelType(prev.audit_type)} · ${fmt(prev.started_at)}</p>`:''}</div><div class="card"><h3>По блокам</h3>${blockHtml}</div><div class="actions"><button class="btn primary" id="exportBtn">Скачать Excel</button><button class="btn" id="crmBtn">Записать итог в CRM</button>${session.audit_type==='day60'?'<button class="btn good" id="baselineBtn">Зафиксировать Healthy Baseline</button>':''}<button class="btn" id="backBtn">← История</button></div><div id="sumMsg" class="okline"></div>`;
      $('exportBtn').onclick=exportXlsx;$('crmBtn').onclick=writeCRM;$('backBtn').onclick=renderHome;let bb=$('baselineBtn');if(bb)bb.onclick=setBaseline; }
    async function setBaseline(){try{await api('/api/platform/audits/'+session.id+'/baseline',{method:'POST',body:'{}'});$('sumMsg').textContent='✓ Healthy Baseline зафиксирован в Postgres';}catch(e){alert(e.message)}}
    function writeCRM(){if(!window.SSCrm)return alert('CRM недоступна');let id=(session.restaurant_key||'').startsWith('crm:')?session.restaurant_key.slice(4):'';let c=id&&SSCrm.getClient(id);if(!c)return alert('Этот аудит не привязан к локальной карточке CRM на этом устройстве');let text=`${labelType(session.audit_type)} Master Audit: ${session.overall_score}/100 · Red Flags: ${session.red_flags_count} · ${new Date().toLocaleDateString('ru-RU')}`;SSCrm.addComment(id,text);if(session.audit_type==='day0')SSCrm.upsertClient({id,status:'diagnose'});else if(session.audit_type==='day30'||session.audit_type==='day60')SSCrm.upsertClient({id,status:'change'});$('sumMsg').textContent='✓ итог добавлен в карточку CRM';}
    function exportXlsx(){if(!window.XLSX)return alert('Не загрузилась библиотека Excel');let rows=template.map(it=>{let a=answers[it.id]||{};return {'№':it.id,'ID':it.code,'Блок':it.section,'Вес, %':it.weight,'Критичный':it.critical?'ДА':'НЕТ','Стандарт / вопрос аудита':it.standard,'Как проверять / evidence':it.evidence,'Оценка 0–2':a.is_na?'N/A':(a.score??''),'Комментарий аудитора':a.comment||'','Red Flag':it.critical&&a.score===0&&!a.is_na?'RED FLAG':''}});let red=rows.filter(r=>r['Red Flag']==='RED FLAG');let dash=[['AH RESTAURANT OPERATING SYSTEM — MASTER AUDIT'],['Ресторан',session.restaurant_title],['Контрольная точка',labelType(session.audit_type)],['Дата',fmt(session.completed_at||session.started_at)],['Общий индекс',session.overall_score],['Red Flags',session.red_flags_count],[],['Блок','Баллы'],...Object.entries(session.block_scores||{})];let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(dash),'Dashboard');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Master Audit');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(red),'Red Flags');let safe=session.restaurant_title.replace(/[^a-zа-я0-9_-]+/gi,'_').slice(0,40);XLSX.writeFile(wb,`${safe}_${session.audit_type}_${new Date().toISOString().slice(0,10)}.xlsx`)}
    boot();
  })();
  </script>
