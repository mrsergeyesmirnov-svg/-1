<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Состояние смены</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css?v=51" />
  <script>window.MINIAPP_API_BASE = window.MINIAPP_API_BASE || "";</script>
</head>
<body>
  <div id="app" class="shell">
    <header class="top">
      <div class="top-text">
        <p class="brand">Состояние <span>смены</span></p>
        <p class="sub" id="roleLine">Загрузка…</p>
      </div>
      <button type="button" class="period" id="btnPeriod" hidden>Неделя</button>
    </header>

    <div class="loc-bar" id="locBar" hidden>
      <label for="locSelect">Точка</label>
      <select id="locSelect"></select>
    </div>

    <main id="view" class="view" aria-live="polite">
      <p class="muted center">Открываем…</p>
    </main>

    <nav class="tabbar" id="tabbar" hidden>
      <button type="button" data-tab="home" class="on">
        <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5z"/></svg></span>
        <span>Обзор</span>
      </button>
      <button type="button" data-tab="signals">
        <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8c1.2 2.4 1.6 4 1.2 5.4-.3 1.1-1.1 2-1.1 2s1.5-0.4 2.6-1.8c1.4 2 2.3 3.7 2.3 5.8a5 5 0 1 1-10 0c0-3.2 2.2-5.4 5-11.4z"/><path d="M10.2 16.2c.5 1.4 1.4 2 1.8 2.1"/></svg></span>
        <span>Горящие</span>
      </button>
      <button type="button" data-tab="mentor">
        <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 19.2c1.2-3 3.4-4.5 6.5-4.5s5.3 1.5 6.5 4.5"/><path d="M17.5 4.5 19 6l1.5-1.5M4.5 4.5 6 6 7.5 4.5"/></svg></span>
        <span>Наставник</span>
      </button>
      <button type="button" data-tab="report">
        <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.5h7.5L19 8v12.5a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1z"/><path d="M14 3.5V8h4.5M8.5 12h7M8.5 15.5h7M8.5 19h4"/></svg></span>
        <span>Отчёт</span>
      </button>
      <button type="button" data-tab="more">
        <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="18.5" cy="12" r="1.2" fill="currentColor" stroke="none"/></svg></span>
        <span>Ещё</span>
      </button>
    </nav>
  </div>
  <script src="app.js?v=51"></script>
</body>
</html>
