<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PulseTeam · демо-ролики онбординга</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --accent: #ff5a1f; --ink: #f4f1ec; --muted: #a8a29a; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 400px at 50% 0%, rgba(255,90,31,0.16), transparent 55%),
        #07090d;
      display: grid; place-items: center; padding: 40px 20px;
    }
    main { max-width: 520px; width: 100%; }
    h1 {
      font-family: Manrope, sans-serif; font-weight: 800;
      letter-spacing: -0.03em; font-size: 1.8rem; margin: 0 0 8px;
    }
    h1 span { color: var(--accent); }
    p { color: var(--muted); margin: 0 0 28px; line-height: 1.5; }
    a.card {
      display: block; text-decoration: none; color: inherit;
      padding: 18px 20px; margin-bottom: 12px;
      border-radius: 18px;
      background: rgba(255,255,255,0.04);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
      transition: 0.25s ease;
    }
    a.card:hover { background: rgba(255,90,31,0.1); }
    a.card strong {
      font-family: Manrope, sans-serif; display: block;
      margin-bottom: 4px; font-size: 1.05rem;
    }
    a.card span { color: var(--muted); font-size: 0.92rem; }
  </style>
</head>
<body>
  <main>
    <h1>Pulse<span>Team</span></h1>
    <p>Пробные ролики в стиле product-update: открой и они играют сами. Для клиента или онбординга — можно снять экран.</p>
    <a class="card" href="demo-manager-alert.html">
      <strong>1 · Push-алерт менеджеру</strong>
      <span>Сигнал → комментарии линии → «В работу»</span>
    </a>
    <a class="card" href="demo-waiter-checkin.html">
      <strong>2 · Официант · 10 секунд</strong>
      <span>Оценка → тема → комментарий → спасибо</span>
    </a>
  </main>
</body>
</html>
