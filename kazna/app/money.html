<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Казна · Деньги</title>
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="app" id="app" hidden>
    <div class="topbar">
      <div class="logo">Казна<span>.</span></div>
      <button class="btn ghost sm" type="button" id="logoutBtn">Выйти</button>
    </div>
    <nav class="nav">
      <a href="/home.html">Обзор</a>
      <a class="on" href="/money.html">Деньги</a>
      <a href="/calendar.html">Календарь</a>
      <a href="/requests.html">Заявки</a>
      <a href="/import.html">Импорт</a>
      <a href="/people.html">Люди</a>
    </nav>
    <div class="badge">Счета и юрлица</div>
    <h1>Деньги сети</h1>
    <p class="sub">Юрлица/р/с из платёжек и файл остатков. Здесь видно, чьи деньги — ООО или ИП.</p>
    <div class="panel" id="list"></div>
  </div>
  <script src="/js/api.js"></script>
  <script>
    KaznaAPI.me().then(async function (user) {
      if (user.role !== "fin_director") { location.href = "/manager.html"; return; }
      document.getElementById("app").hidden = false;
      document.getElementById("logoutBtn").onclick = async function () {
        await KaznaAPI.logout(); location.href = "/";
      };
      var o = await KaznaAPI.overview();
      document.getElementById("list").innerHTML = o.accounts.length
        ? o.accounts.map(function (a) {
            return '<div class="row pay"><div><strong>' + a.name + '</strong><div class="muted">' +
              (a.kind || "юрлицо / р/с") + (a.org && a.org !== a.name ? (" · " + a.org) : "") +
              '</div></div><div class="amount">' + a.balanceLabel +
              '</div><div class="muted">остаток</div>' +
              '<div><span class="status ok">счёт</span></div><div></div></div>';
          }).join("")
        : '<p class="muted">Счетов нет. Загрузите остатки или Excel с колонкой «Организация» / «Плательщик».</p>';
    }).catch(function () { location.href = "/"; });
  </script>
</body>
</html>
