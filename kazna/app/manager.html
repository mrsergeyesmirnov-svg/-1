<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Казна · Управляющий</title>
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="app" id="app" hidden>
    <div class="topbar">
      <div class="logo">Казна<span>.</span></div>
      <div class="user-chip">
        <div>
          <strong id="userName">—</strong>
          <div id="userRole" class="muted"></div>
        </div>
        <button class="btn ghost sm" type="button" id="logoutBtn">Выйти</button>
      </div>
    </div>
    <nav class="nav">
      <a class="on" href="/manager.html">Мои заявки</a>
    </nav>
    <div class="badge">Кабинет управляющего</div>
    <h1>Скоро</h1>
    <p class="sub">Сейчас поднимаем контур финдира и Excel. Форма заявок — следующий шаг.</p>
  </div>
  <script src="/js/api.js"></script>
  <script>
    KaznaAPI.me().then(function (user) {
      if (user.role !== "manager") { location.href = "/home.html"; return; }
      document.getElementById("app").hidden = false;
      document.getElementById("userName").textContent = user.name;
      document.getElementById("userRole").textContent = user.roleLabel;
      document.getElementById("logoutBtn").onclick = async function () {
        await KaznaAPI.logout(); location.href = "/";
      };
    }).catch(function () { location.href = "/"; });
  </script>
</body>
</html>
