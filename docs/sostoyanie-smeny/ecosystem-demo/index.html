<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Смена — HoReCa среда</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#14213d;--muted:#6b7280;--blue:#2f6bff;--blue2:#eaf0ff;--mint:#eaf8f2;--line:#e6e9ef;--danger:#ffefef;--shadow:0 12px 32px rgba(20,33,61,.10)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef3ff 0,#f7f8fb 35%,#f5f7fb 100%);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
button,input,textarea{font:inherit}.shell{max-width:1180px;margin:auto;min-height:100vh;display:grid;grid-template-columns:250px 1fr;gap:24px;padding:22px}
.sidebar{background:#101a33;color:#fff;border-radius:28px;padding:22px;position:sticky;top:22px;height:calc(100vh - 44px);display:flex;flex-direction:column}
.brand{font-size:24px;font-weight:850;letter-spacing:-.7px}.brand small{display:block;color:#9db6ff;font-size:11px;letter-spacing:.13em;text-transform:uppercase;margin-bottom:6px}
.nav{display:grid;gap:7px;margin-top:28px}.nav button,.role button{border:0;background:transparent;color:#bdc7dc;text-align:left;padding:12px 14px;border-radius:14px;cursor:pointer}.nav button.active,.nav button:hover{background:#263557;color:#fff}.role{margin-top:auto}.role label{display:block;color:#71809f;font-size:11px;margin:0 0 8px 12px;text-transform:uppercase}.role button{width:100%;background:#192642;color:#fff;margin-top:6px}.role button.active{background:#2f6bff}
.main{min-width:0}.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 20px}.top h1{margin:0;font-size:28px;letter-spacing:-.8px}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#14213d;color:white;font-weight:800}
.grid{display:grid;grid-template-columns:1.3fr .8fr;gap:16px}.cards{display:grid;gap:14px}.card{background:rgba(255,255,255,.94);border:1px solid #edf0f5;border-radius:22px;padding:20px;box-shadow:0 4px 18px rgba(20,33,61,.05)}.card h2,.card h3{margin:0 0 8px}.muted{color:var(--muted)}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
.hero{background:linear-gradient(135deg,#14213d,#263d72);color:white;padding:28px}.hero h2{font-size:27px;letter-spacing:-.7px;max-width:650px}.hero p{color:#c7d3ec;max-width:650px;line-height:1.5}
.btn{border:0;border-radius:13px;padding:11px 15px;background:var(--blue);color:#fff;font-weight:750;cursor:pointer}.btn.secondary{background:var(--blue2);color:var(--blue)}.btn.ghost{background:#f3f5f9;color:var(--ink)}.btn.dark{background:#14213d}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.pills{display:flex;gap:7px;flex-wrap:wrap}.pill{padding:7px 10px;background:#f0f3f8;border-radius:999px;font-size:12px;color:#4b5563}.pill.blue{background:var(--blue2);color:var(--blue)}.pill.green{background:var(--mint);color:#167553}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f7f9fc;padding:14px;border-radius:16px}.stat b{font-size:22px;display:block}.stat span{font-size:11px;color:var(--muted)}
.item{padding:14px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}.itemtop{display:flex;justify-content:space-between;gap:10px}.item h3{font-size:16px}.price{font-weight:800;white-space:nowrap}.meta{font-size:12px;color:var(--muted);margin:5px 0}.reason{background:var(--mint);padding:10px 12px;border-radius:12px;font-size:12px;margin-top:9px;color:#225c49}
.tabs{display:flex;gap:8px;margin-bottom:15px;overflow:auto}.tabs button{white-space:nowrap;border:0;background:#fff;border-radius:999px;padding:9px 13px;color:#667085;cursor:pointer}.tabs button.active{background:#14213d;color:white}
.screen{display:none}.screen.active{display:block}.phonebar{display:none}
.checkgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.mood{border:1px solid var(--line);background:#fff;border-radius:15px;padding:13px 6px;text-align:center;cursor:pointer;font-size:20px}.mood span{display:block;font-size:10px;color:var(--muted);margin-top:4px}.mood.selected{border-color:var(--blue);background:var(--blue2)}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:14px;padding:12px;resize:vertical}.chart{height:150px;display:flex;align-items:flex-end;gap:8px;padding-top:18px}.bar{flex:1;background:#dce5ff;border-radius:8px 8px 3px 3px;min-height:10px;position:relative}.bar:last-child{background:var(--blue)}.bar small{position:absolute;bottom:-19px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted)}
.circle{display:flex;gap:12px;align-items:center}.circleIcon{width:46px;height:46px;border-radius:15px;background:#eef2ff;display:grid;place-items:center;font-size:22px;flex:none}
.feedpost{display:flex;gap:12px}.miniavatar{width:38px;height:38px;border-radius:50%;background:#dde6ff;display:grid;place-items:center;flex:none}
.progress{height:8px;background:#edf0f5;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--blue);border-radius:99px}
.kpi{font-size:30px;font-weight:850;letter-spacing:-1px}.trend.up{color:#16845b}.trend.down{color:#c34242}.notice{padding:13px;border-radius:14px;background:#fff6df;color:#755a15;font-size:13px}
.dialog{background:#f6f8fc;border-radius:18px;padding:14px}.bubble{max-width:82%;padding:11px 13px;border-radius:16px;margin:7px 0;font-size:13px;line-height:1.4}.bubble.sys{background:white}.bubble.me{background:#2f6bff;color:white;margin-left:auto}
.overlay{position:fixed;inset:0;background:rgba(9,15,30,.55);display:none;place-items:center;padding:18px;z-index:50}.overlay.open{display:grid}.modal{width:min(520px,100%);background:white;border-radius:24px;padding:22px;box-shadow:var(--shadow)}.modalhead{display:flex;justify-content:space-between;align-items:center}.x{border:0;background:#f1f3f7;width:34px;height:34px;border-radius:50%;cursor:pointer}
.trackerFace{text-align:center;font-size:58px;line-height:1;margin:8px 0 4px}.trackerWord{text-align:center;font-size:20px;font-weight:800;margin-bottom:18px}
.rangeWrap{padding:2px 2px 14px}.rangeLabels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:5px}
input[type=range]{width:100%;height:8px;border-radius:99px;appearance:none;-webkit-appearance:none;background:linear-gradient(90deg,#ff9f9f 0%,#ffd59a 25%,#e9e9ef 50%,#bde7c9 75%,#9fc5ff 100%);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:white;border:3px solid var(--blue);box-shadow:0 3px 12px rgba(20,33,61,.22)}
.sliderRow{display:grid;grid-template-columns:85px 1fr 34px;align-items:center;gap:10px;margin:15px 0}.sliderRow b{font-size:13px}.sliderVal{text-align:right;font-weight:800;color:var(--blue)}
.selectChip{border:0;cursor:pointer}.selectChip.active{background:var(--blue);color:white}
.eventHero{min-height:180px;border-radius:20px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(145deg,#dfe8ff,#f1eaff);margin:10px 0 14px}.eventHero .date{font-size:12px;font-weight:800;color:var(--blue)}.eventHero h2{font-size:24px;margin:5px 0}.eventGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.eventTile{border:1px solid var(--line);border-radius:17px;padding:15px;background:#fff}.eventTile h3{font-size:15px;margin:6px 0}.eventType{font-size:11px;color:var(--blue);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.message{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}.message:first-of-type{border-top:0}.messageBody{min-width:0;flex:1}.messageBody p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:4px 0;color:var(--muted);font-size:12px}.unread{width:8px;height:8px;border-radius:50%;background:var(--blue);margin-top:8px}
.template{border:1px solid var(--line);background:white;border-radius:13px;padding:10px 12px;cursor:pointer;text-align:left;font-size:12px}
.toast{position:fixed;right:24px;bottom:24px;background:#14213d;color:white;padding:12px 16px;border-radius:13px;opacity:0;transform:translateY(10px);transition:.25s;z-index:80}.toast.show{opacity:1;transform:none}
@media(max-width:820px){.shell{display:block;padding:0 0 82px}.sidebar{display:none}.main{padding:16px}.grid{grid-template-columns:1fr}.top h1{font-size:23px}.hero{padding:22px}.hero h2{font-size:24px}.phonebar{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:30;padding:7px 4px calc(7px + env(safe-area-inset-bottom))}.phonebar button{border:0;background:transparent;font-size:10px;color:#687083;cursor:pointer}.phonebar button b{display:block;font-size:19px;margin-bottom:2px}.phonebar button.active{color:var(--blue)}.statrow{grid-template-columns:1fr 1fr}.statrow .stat:last-child{grid-column:1/-1}.eventGrid{grid-template-columns:1fr}.checkgrid{gap:5px}.mood{font-size:18px}}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar">
  <div class="brand"><small>HoReCa professional network</small>Смена</div>
  <div class="nav" id="sideNav"></div>
  <div class="role">
    <label>Посмотреть как</label>
    <button data-role="person" class="active">👤 Сотрудник</button>
    <button data-role="restaurant">🏠 Ресторан</button>
    <button data-role="expert">✦ Эксперт</button>
    <button data-role="organizer">🎓 Организатор</button>
  </div>
</aside>
<main class="main">
  <div class="top"><h1 id="title">Сегодня</h1><div class="avatar" id="avatar">С</div></div>

  <section id="home" class="screen active"></section>
  <section id="opportunities" class="screen"></section>
  <section id="events" class="screen"></section>
  <section id="community" class="screen"></section>
  <section id="diary" class="screen"></section>
  <section id="profile" class="screen"></section>
</main>
</div>
<nav class="phonebar" id="phoneNav"></nav>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
const state={role:'person',screen:'home',opp:'jobs',mood:null};
const navPerson=[['home','⌂','Сегодня'],['diary','♡','Состояние'],['events','◇','События'],['opportunities','◎','Работа'],['community','◌','Люди'],['profile','○','Профиль']];
const navRestaurant=[['home','⌂','Обзор'],['opportunities','◎','Люди'],['community','✦','Решения'],['diary','▥','Команда'],['profile','○','Ресторан']];
const navExpert=[['home','⌂','Главная'],['opportunities','◎','Проекты'],['community','◌','Сообщество'],['diary','▥','Материалы'],['profile','○','Профиль']];
const navOrganizer=[['home','⌂','Главная'],['opportunities','◎','События'],['community','◌','Аудитория'],['diary','▥','Статистика'],['profile','○','Профиль']];
const jobs=[
 {t:'Официант · вечерняя смена',place:'MØS · Петроградская',meta:'Сегодня · 18:00–00:00',price:'4 500 ₽',reason:'Подходит по опыту casual dining, графику и формату сервиса.'},
 {t:'Официант · постоянная работа',place:'Sintoho · центр',meta:'2/2 · premium dining',price:'от 95 000 ₽',reason:'Ресторан ищет опыт гостевого сервиса и интерес к вину.'},
 {t:'Бармен · гостевая смена',place:'Inner · Васильевский',meta:'Пятница · 19:00–02:00',price:'5 000 ₽',reason:'Совпадают формат, опыт бара и желаемый график.'}
];
const events=[
 {t:'Сервис без скриптов',place:'Открытая практика · 24 участника',meta:'3 октября · 19:00',price:'Бесплатно',reason:'Тема близка твоим интересам: гостеприимство и сервис.'},
 {t:'Вино: слепая дегустация',place:'Кружок «Вино без снобизма»',meta:'5 октября · 18:30',price:'1 200 ₽',reason:'Участники с похожим профессиональным интересом уже записались.'},
 {t:'Выезд на обжарочное производство',place:'North Coffee',meta:'12 октября · 11:00',price:'900 ₽',reason:'Подойдёт тем, кто хочет глубже понимать продукт.'}
];
const courses=[
 {t:'От официанта к менеджеру',place:'6 практических встреч',meta:'Старт 10 октября',price:'8 900 ₽',reason:'Ты отмечал интерес к управлению и развитию команды.'},
 {t:'Вино для сервиса',place:'4 занятия + практика',meta:'Старт 16 октября',price:'6 500 ₽',reason:'Курс закрывает продуктовую компетенцию для premium-ресторанов.'}
];
const circles=[
 ['🍷','Вино без снобизма','126 участников','Дегустации раз в две недели'],
 ['⚽️','После смены','348 участников','Сегодня собираются 12 человек'],
 ['↗','Официанты → менеджеры','84 участника','Кейсы, встречи и разборы'],
 ['☕️','Specialty coffee','211 участников','Кофейни, каппинги, выезды']
];

function nav(){return state.role==='restaurant'?navRestaurant:state.role==='expert'?navExpert:state.role==='organizer'?navOrganizer:navPerson}
function renderNav(){
 const n=nav();
 sideNav.innerHTML=n.map(x=>'<button data-screen="'+x[0]+'" class="'+(state.screen===x[0]?'active':'')+'">'+x[1]+' &nbsp;'+x[2]+'</button>').join('');
 phoneNav.innerHTML=n.map(x=>'<button data-screen="'+x[0]+'" class="'+(state.screen===x[0]?'active':'')+'"><b>'+x[1]+'</b>'+x[2]+'</button>').join('');
 document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>go(b.dataset.screen));
 document.querySelectorAll('[data-role]').forEach(b=>b.classList.toggle('active',b.dataset.role===state.role));
}
function go(s){state.screen=s;document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(s).classList.add('active');render();window.scrollTo({top:0,behavior:'smooth'})}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
function openModal(html){modal.innerHTML=html;overlay.classList.add('open')}
function closeModal(){overlay.classList.remove('open')}
overlay.onclick=e=>{if(e.target===overlay)closeModal()}
function item(x,button='Открыть'){
 return '<div class="item"><div class="itemtop"><div><h3>'+x.t+'</h3><div class="meta">'+x.place+' · '+x.meta+'</div></div><div class="price">'+x.price+'</div></div><div class="reason">'+x.reason+'</div><div class="actions"><button class="btn secondary" onclick="toast(\'Открыли карточку\')">'+button+'</button><button class="btn ghost" onclick="toast(\'Сохранено\')">Сохранить</button></div></div>'
}
function personHome(){
 return '<div class="cards"><div class="card hero"><div class="eyebrow" style="color:#8eb0ff">Добрый день, Сергей</div><h2>Твоя профессиональная жизнь в гостеприимстве — в одном месте.</h2><p>Отмечай своё состояние в любой момент дня, смотри подходящие возможности и находи людей, с которыми хочется расти.</p><div class="actions"><button class="btn" onclick="checkin()">Как я себя чувствую</button><button class="btn ghost" onclick="go(\'opportunities\')">Что мне подходит</button></div></div><div class="grid"><div class="card"><div class="eyebrow">Для тебя</div><h2>Сегодня есть 6 подходящих возможностей</h2>'+item(jobs[0],'Посмотреть смену')+item(events[0],'Посмотреть событие')+'</div><div class="cards"><div class="card"><div class="eyebrow">Моя неделя</div><div class="statrow"><div class="stat"><b>3</b><span>отметки сегодня</span></div><div class="stat"><b>3.8</b><span>энергия</span></div><div class="stat"><b>+0.4</b><span>к прошлой неделе</span></div></div><div class="chart">'+[55,72,42,80,67,88,76].map((h,i)=>'<div class="bar" style="height:'+h+'%"><small>'+['Пн','Вт','Ср','Чт','Пт','Сб','Вс'][i]+'</small></div>').join('')+'</div></div><div class="card"><div class="eyebrow">Кружок рядом</div><div class="circle"><div class="circleIcon">⚽️</div><div><h3>После смены</h3><div class="muted">12 человек играют сегодня в 23:30</div></div></div><div class="actions"><button class="btn secondary" onclick="toast(\'Ты в списке встречи\')">Присоединиться</button></div></div></div></div>'
}
function opportunities(){
 const data=state.opp==='jobs'?jobs:courses;
 return '<div class="tabs"><button data-opp="jobs" class="'+(state.opp==='jobs'?'active':'')+'">Работа и смены</button><button data-opp="courses" class="'+(state.opp==='courses'?'active':'')+'">Обучение</button></div><div class="grid"><div class="card"><div class="eyebrow">Подобрано для тебя</div><h2>'+(state.opp==='jobs'?'Работа без бесконечной ленты':'Что изучить дальше')+'</h2><p class="muted">Система показывает релевантное. Внутренний мэтч не отображается как рейтинг или процент.</p>'+data.map(x=>item(x)).join('')+'</div><div class="card"><h3>Настроить рекомендации</h3><p class="muted">Что тебе сейчас интереснее?</p><div class="pills"><span class="pill blue">Подработки</span><span class="pill">Рост в менеджмент</span><span class="pill">Вино</span><span class="pill">Сервис</span><span class="pill">Люди</span></div><div class="actions"><button class="btn secondary" onclick="professionalDialog()">Профессиональный диалог</button></div></div></div>'
}
function eventsPage(){
 return '<div class="cards"><div class="card"><div class="eyebrow">Мероприятия</div><h2>Живые события индустрии</h2><p class="muted">Мастер-классы, практики, дегустации, выезды и встречи. Лента учитывает твои профессиональные интересы и город.</p><div class="eventHero"><div class="date">3 ОКТЯБРЯ · 19:00</div><h2>Сервис без скриптов</h2><div>Открытая практика · 24 участника · бесплатно</div><div class="actions"><button class="btn" onclick="eventDetails()">Открыть мероприятие</button><button class="btn ghost" onclick="toast(\'Добавлено в календарь\')">В календарь</button></div></div><div class="tabs"><button class="active">Для тебя</button><button>На этой неделе</button><button>Бесплатно</button><button>Рядом</button></div><div class="eventGrid"><div class="eventTile"><div class="eventType">Дегустация</div><h3>Вино вслепую</h3><div class="meta">5 октября · 18:30</div><p>Кружок «Вино без снобизма»</p><button class="btn secondary" onclick="eventDetails()">Подробнее</button></div><div class="eventTile"><div class="eventType">Выезд</div><h3>Как живёт обжарка</h3><div class="meta">12 октября · 11:00</div><p>North Coffee · производство</p><button class="btn secondary" onclick="eventDetails()">Подробнее</button></div><div class="eventTile"><div class="eventType">Мастер-класс</div><h3>Бар без лишних движений</h3><div class="meta">14 октября · 19:30</div><p>Практика для барменов</p><button class="btn secondary" onclick="eventDetails()">Подробнее</button></div><div class="eventTile"><div class="eventType">Встреча</div><h3>Официант → менеджер</h3><div class="meta">18 октября · 17:00</div><p>Разговор с тремя управляющими</p><button class="btn secondary" onclick="eventDetails()">Подробнее</button></div></div></div></div>'
}
function eventDetails(){
 openModal('<div class="modalhead"><div><div class="eyebrow">Открытая практика</div><h2>Сервис без скриптов</h2></div><button class="x" onclick="closeModal()">×</button></div><p class="muted">3 октября · 19:00–21:00 · Санкт-Петербург</p><p>Практическая встреча о том, как сохранять живое гостеприимство и не превращать сервис в набор заученных фраз.</p><div class="pills"><span class="pill blue">Сервис</span><span class="pill">Практика</span><span class="pill">Официанты</span><span class="pill">Менеджеры</span></div><div class="item"><b>Ведущий</b><p class="muted">Эксперт индустрии · профиль доступен в приложении</p></div><button class="btn" style="width:100%" onclick="toast(\'Ты зарегистрирован\');closeModal()">Записаться бесплатно</button>')
}
function community(){
