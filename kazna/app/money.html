<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Казна · Деньги</title>
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="app" id="app" hidden>
    <div class="topbar">
      <div class="logo">Казна<span>.</span></div>
      <button class="btn ghost sm" type="button" id="logoutBtn">Выйти</button>
    </div>
    <nav class="nav">
      <a href="home.html">Обзор</a>
      <a class="on" href="money.html">Деньги</a>
      <a href="calendar.html">Календарь</a>
      <a href="requests.html">Заявки</a>
      <a href="people.html">Люди</a>
    </nav>
    <div class="badge">Счета и кассы</div>
    <h1>Деньги сети</h1>
    <p class="sub">Следующий экран после оболочки: остатки по р/с, кассы норма/факт, «хватит ли сегодня».</p>
    <div class="panel" id="list"></div>
  </div>
  <script src="js/auth.js"></script>
  <script src="js/seed.js"></script>
  <script>
    var user = KaznaAuth.requireRole(["fin_director"]);
    if (user) {
      document.getElementById("app").hidden = false;
      document.getElementById("logoutBtn").onclick = KaznaAuth.logout;
      document.getElementById("list").innerHTML = KaznaSeed.accounts.map(function (a) {
        return '<div class="row pay"><div><strong>' + a.name + '</strong><div class="muted">' + a.kind +
          '</div></div><div class="amount">' + KaznaSeed.fmt(a.balance) +
          '</div><div class="muted">к оплате ' + KaznaSeed.fmt(a.due) +
          '</div><div><span class="status ' + (a.ok ? "ok" : "new") + '">' +
          (a.ok ? "хватит" : "внимание") + "</span></div><div></div></div>";
      }).join("");
    }
  </script>
</body>
</html>
