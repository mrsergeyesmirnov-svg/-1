<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Казна · Календарь</title>
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="app" id="app" hidden>
    <div class="topbar">
      <div class="logo">Казна<span>.</span></div>
      <button class="btn ghost sm" type="button" id="logoutBtn">Выйти</button>
    </div>
    <nav class="nav">
      <a href="/home.html">Обзор</a>
      <a href="/money.html">Деньги</a>
      <a class="on" href="/calendar.html">Календарь</a>
      <a href="/requests.html">Заявки</a>
      <a href="/import.html">Импорт</a>
      <a href="/people.html">Люди</a>
    </nav>
    <div class="badge">Управление оплатами</div>
    <h1>Календарь</h1>
    <p class="sub">Ставьте срок, юрлицо и статус — «к оплате сегодня» на обзоре оживает.</p>

    <div class="panel">
      <div class="filt" id="filters">
        <button type="button" class="chip on" data-f="all">Все</button>
        <button type="button" class="chip" data-f="nodate">Без даты</button>
        <button type="button" class="chip" data-f="week">7 дней</button>
        <button type="button" class="chip" data-f="open">Не оплачены</button>
        <button type="button" class="chip" data-f="done">Оплачены</button>
      </div>
      <p id="msg" class="muted" style="margin:10px 0 0;"></p>
    </div>

    <div class="panel">
      <h2>Добавить платёж вручную</h2>
      <form id="addForm" class="form-grid">
        <div class="field">
          <label for="aWho">Кому</label>
          <input id="aWho" placeholder="ООО Поставщик" />
        </div>
        <div class="field">
          <label for="aWhat">За что</label>
          <input id="aWhat" required placeholder="продукты" />
        </div>
        <div class="field">
          <label for="aSum">Сумма</label>
          <input id="aSum" type="number" min="1" step="0.01" required />
        </div>
        <div class="field">
          <label for="aDate">Срок</label>
          <input id="aDate" type="date" />
        </div>
        <div class="field">
          <label for="aAcc">Юрлицо / р/с</label>
          <select id="aAcc"></select>
        </div>
        <div class="field">
          <label for="aNote">Коммент</label>
          <input id="aNote" placeholder="по желанию" />
        </div>
        <div class="full">
          <button class="btn accent" type="submit">В календарь</button>
        </div>
      </form>
    </div>

    <div class="panel">
      <h2>Очередь</h2>
      <div id="list"><p class="muted">Загрузка…</p></div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/pay-row.js"></script>
  <script>
    (function () {
      var all = [];
      var accounts = [];
      var filter = "all";
      var statusMap = { new: "новая", plan: "в плане", ok: "ок", done: "оплачено" };

      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      function todayISO() {
        var d = new Date();
        return d.toISOString().slice(0, 10);
      }

      function inWeek(iso) {
        if (!iso) return false;
        var t = new Date(); t.setHours(0,0,0,0);
        var end = new Date(t); end.setDate(end.getDate() + 7);
        var x = new Date(iso + "T00:00:00");
        return x >= t && x <= end;
      }

      function filtered() {
        return all.filter(function (p) {
          if (filter === "nodate") return !p.date;
          if (filter === "week") return inWeek(p.date);
          if (filter === "open") return p.status !== "done";
          if (filter === "done") return p.status === "done";
          return true;
        });
      }

      function fillAccSelect(sel, value) {
        var opts = '<option value="">не указано</option>' +
          accounts.map(function (a) {
            var v = a.name;
            return '<option value="' + esc(v) + '"' + (value === v ? " selected" : "") + ">" +
              esc(a.name) + "</option>";
          }).join("");
        sel.innerHTML = opts;
      }

      async function save(id, patch) {
        var msg = document.getElementById("msg");
        msg.textContent = "Сохраняю…";
        try {
          await KaznaAPI.patchPayment(id, patch);
          msg.textContent = "Сохранено.";
          await reload();
        } catch (ex) {
          msg.textContent = ex.message;
        }
      }

      function render() {
        var rows = filtered();
        var el = document.getElementById("list");
        if (!rows.length) {
          el.innerHTML = '<p class="muted">Пусто в этом фильтре.</p>';
          return;
        }
        el.innerHTML = rows.map(function (p) {
          return (
            '<div class="pay-edit" data-id="' + p.id + '">' +
            KaznaPayRow.render(p) +
            '<div class="pay-controls form-grid">' +
            '<div class="field"><label>Срок</label><input type="date" data-date="' + p.id + '" value="' + esc(p.date || "") + '" /></div>' +
            '<div class="field"><label>Статус</label><select data-status="' + p.id + '">' +
            ["plan","new","ok","done"].map(function (s) {
              return '<option value="' + s + '"' + (p.status === s ? " selected" : "") + ">" +
                (statusMap[s] || s) + "</option>";
            }).join("") +
            "</select></div>" +
            '<div class="field"><label>Юрлицо / р/с</label><select data-acc="' + p.id + '"></select></div>' +
            '<div class="field"><label>Коммент</label><input data-note="' + p.id + '" value="' + esc(p.note || "") + '" /></div>' +
            '<div class="full req-actions">' +
            '<button class="btn sm accent" type="button" data-save="' + p.id + '">Сохранить</button>' +
            '<button class="btn sm" type="button" data-today="' + p.id + '">На сегодня</button>' +
            '<button class="btn sm ghost" type="button" data-done="' + p.id + '">Оплачено</button>' +
            "</div></div></div>"
          );
        }).join("");

        rows.forEach(function (p) {
          var sel = el.querySelector('select[data-acc="' + p.id + '"]');
          if (sel) fillAccSelect(sel, p.account || "");
        });

        el.querySelectorAll("[data-save]").forEach(function (btn) {
          btn.onclick = function () {
            var id = Number(btn.getAttribute("data-save"));
            save(id, {
              pay_date: el.querySelector('input[data-date="' + id + '"]').value || "",
              status: el.querySelector('select[data-status="' + id + '"]').value,
              account_name: el.querySelector('select[data-acc="' + id + '"]').value,
              note: el.querySelector('input[data-note="' + id + '"]').value
            });
          };
        });
        el.querySelectorAll("[data-today]").forEach(function (btn) {
          btn.onclick = function () {
            save(Number(btn.getAttribute("data-today")), { pay_date: todayISO(), status: "plan" });
          };
        });
        el.querySelectorAll("[data-done]").forEach(function (btn) {
          btn.onclick = function () {
            save(Number(btn.getAttribute("data-done")), { status: "done" });
          };
        });
      }

      async function reload() {
        all = await KaznaAPI.payments();
        accounts = await KaznaAPI.accounts();
        fillAccSelect(document.getElementById("aAcc"), "");
        render();
      }

      KaznaAPI.me().then(async function (user) {
        if (user.role === "manager") { location.href = "/manager.html"; return; }
        document.getElementById("app").hidden = false;
        if (user.role !== "fin_director") {
          document.querySelectorAll('a[href="/people.html"], a[href="/import.html"]').forEach(function (a) {
            a.hidden = true;
          });
        }
        document.getElementById("logoutBtn").onclick = async function () {
          await KaznaAPI.logout(); location.href = "/";
        };

        document.querySelectorAll("#filters .chip").forEach(function (chip) {
          chip.onclick = function () {
            document.querySelectorAll("#filters .chip").forEach(function (c) { c.classList.remove("on"); });
            chip.classList.add("on");
            filter = chip.getAttribute("data-f");
            render();
          };
        });

        document.getElementById("addForm").onsubmit = async function (e) {
          e.preventDefault();
          var msg = document.getElementById("msg");
          msg.textContent = "Добавляю…";
          try {
            await KaznaAPI.createPayment({
              title: document.getElementById("aWhat").value,
              counterparty: document.getElementById("aWho").value || null,
              amount: Number(document.getElementById("aSum").value),
              pay_date: document.getElementById("aDate").value || null,
              account_name: document.getElementById("aAcc").value || null,
              note: document.getElementById("aNote").value || null,
              status: "plan"
            });
            msg.textContent = "Платёж в календаре.";
            e.target.reset();
            await reload();
          } catch (ex) {
            msg.textContent = ex.message;
          }
        };

        await reload();
      }).catch(function () { location.href = "/"; });
    })();
  </script>
</body>
</html>
